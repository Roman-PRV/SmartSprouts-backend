name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:            # enables /review, /describe, /improve, /ask commands in PR comments
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent:
    # Skip bot-authored events to avoid feedback loops; only run comment events on PRs.
    if: >-
      github.event.sender.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pinning to @main tracks upstream; for reproducibility pin to a release
      # tag or commit SHA (see github.com/qodo-ai/pr-agent/releases), matching
      # the SHA-pinned actions in ci.yml.
      - name: PR Agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- LLM: free Google Gemini (via litellm) ---
          CONFIG.MODEL: "gemini/gemini-2.0-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-1.5-flash"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # --- auto-run on new PRs ---
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
